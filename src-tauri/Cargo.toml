[package]
name = "ronin-tray"
version = "0.1.0"
description = "System tray app for Ronin"
authors = ["roninito"]
license = ""
repository = ""
default-run = "ronin-tray"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri.git", branch = "1.x", features = [] }

[dependencies]
tauri = { git = "https://github.com/tauri-apps/tauri.git", branch = "1.x", features = [ "shell-open", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
open = "5.0"

[[bin]]
name = "ronin-tray"
path = "src/main.rs"
